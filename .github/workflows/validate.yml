name: Validate fingering data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: node --check src/app.js
      - run: node --check src/components/staff.js
      - run: node --check src/diagrams/valveDiagram.js
