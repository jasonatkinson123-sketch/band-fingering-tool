name: Validate fingering data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - name: Syntax check application JavaScript
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
